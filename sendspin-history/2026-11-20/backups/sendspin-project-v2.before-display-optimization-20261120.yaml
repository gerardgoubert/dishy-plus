# Board: Waveshare ESP32-S3-Touch-AMOLED-1.8 V2 (CO5300 display, CST820 touch, ES8311 codec)
# Items marked VERIFY are unconfirmed against an official schematic / the Sendspin docs.

esphome:
  name: sendspin-project-v2
  friendly_name: Sendspin project v2
  # After everything is set up, sync the volume slider/label to the volume
  # the speaker actually restored from flash (otherwise the slider shows 0).
  on_boot:
    priority: -100
    then:
      - script.execute: sync_volume_ui
      # The audio_output_ready binary sensor enables the amplifier only
      # after the playback pipeline has started I2S. Do not start it here.

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret sendspin_api_key

ota:
  - platform: esphome
    password: !secret sendspin_project__ota_password

wifi:
  networks:
    # Primary network: tried first whenever it is in range.
    - ssid: !secret wifi_ssid_1
      password: !secret wifi_password_1
      priority: 10
    # Fallback network: used when the primary is not available.
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
      priority: 0
  on_connect:
    # Works for either network: show whichever SSID we actually joined.
    - lvgl.widget.update: {id: dot_wifi, bg_color: 0x2ECC71}
    - lvgl.label.update:
        id: lbl_wifi_ssid
        text: !lambda |-
          char buf[wifi::SSID_BUFFER_SIZE];
          return std::string(wifi::global_wifi_component->wifi_ssid_to(buf));
  on_disconnect:
    - lvgl.widget.update: {id: dot_wifi, bg_color: 0xE74C3C}
    - lvgl.widget.update: {id: lbl_wifi_icon, text_color: 0x888888}
    - lvgl.widget.update: {id: lbl_wifi_rssi, text_color: 0x888888}
    - lvgl.label.update: {id: lbl_wifi_ssid, text: "Wi-Fi disconnected"}
    - lvgl.label.update: {id: lbl_wifi_rssi, text: "-- dBm"}
  ap:
    ssid: Sendspin Fallback Hotspot
    password: !secret sendspin_ap_password
captive_portal:

# ---------- Buses ----------
i2c:
  - id: i2c_1
    sda: GPIO15
    scl: GPIO14
    scan: true

spi:
  - id: spi_1
    type: quad
    clk_pin: GPIO11
    data_pins: [GPIO4, GPIO5, GPIO6, GPIO7]

# TCA9554 I/O expander at 0x20
# EXIO0 = LCD reset, EXIO2 = touch reset, EXIO7 = panel power (V2)   VERIFY
pca9554:
  - id: expander
    address: 0x20
    i2c_id: i2c_1

switch:
  - platform: gpio
    id: panel_power
    pin:
      pca9554: expander
      number: 7
      mode: output
    restore_mode: ALWAYS_ON
  # Hold the Class-D amplifier off during codec and I2S bring-up.
  # audio_output_ready enables it after I2S is running and has settled.
  - platform: gpio
    id: speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_OFF

# ---------- Display & touch ----------
display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    bus_mode: quad
    spi_id: spi_1
    cs_pin: GPIO12
    reset_pin:
      pca9554: expander
      number: 0
    dimensions:
      width: 368
      height: 448
      offset_width: 16   # VERIFY: V2 visible area reportedly starts at RAM column 16
    color_order: rgb
    invert_colors: false
    brightness: 153
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: cst816          # CST820 is compatible (address 0x15)
    id: touchscreen_1
    display: amoled
    i2c_id: i2c_1
    interrupt_pin: GPIO21
    reset_pin:
      pca9554: expander
      number: 2

  
# ---------- Audio ----------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16      # VERIFY

audio_dac:
  - platform: es8311
    id: dac
    i2c_id: i2c_1
    address: 0x18
    sample_rate: 48000

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: dac
    channel: stereo
    # Must match the Sendspin media_source sample rate (48 kHz default),
    # otherwise the pipeline needs a resampler speaker. Platform default
    # is only 16000.
    sample_rate: 48000
    # Anti-pop: the default (500ms) releases the I2S channel shortly after
    # playback stops, so every stream start re-inits the bus and clicks.
    # `never` keeps the channel enabled, silence-padding the DMA buffers
    # while idle, at the cost of leaving the peripheral/DAC powered.
    timeout: never

# ---------- Sendspin ----------
sendspin:
  id: test_sendspin_client
  task_stack_in_psram: true

# Decodes the synchronized Sendspin stream into PCM. This is what actually
# produces audio; the sendspin media_player below does not.
media_source:
  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true

media_player:
  # Plays audio out of the onboard speaker (I2S -> ES8311 -> amp on GPIO46).
  - platform: speaker_source
    name: Sendspin Speaker
    id: media_player_speaker_1
    # State publications include volume changes received from Music Assistant.
    on_state:
      - script.execute: sync_volume_ui
    media_pipeline:
      speaker: spk
      sources:
        - sendspin_source

  # Group transport/volume control only - sends commands to the Sendspin
  # server and emits no audio on this device.
  - platform: sendspin
    name: Sendspin Test Media Player
    id: media_player_sendspin_1
    # Swap the button icon between play and pause to reflect state.
    on_play:
      - lvgl.label.update:
          id: lbl_play_pause
          text: "\uF04C"   # pause symbol
    on_pause:
      - lvgl.label.update:
          id: lbl_play_pause
          text: "\uF04B"   # play symbol
    on_idle:
      - lvgl.label.update:
          id: lbl_play_pause
          text: "\uF04B"   # play symbol

text_sensor:
  - platform: sendspin
    type: title
    id: track_title
    on_value:
      - lvgl.label.update:
          id: lbl_title
          text: !lambda 'return x.c_str();'
  - platform: sendspin
    type: artist
    id: track_artist
    on_value:
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda 'return x.c_str();'
  - platform: sendspin
    type: album
    id: track_album
  - platform: wifi_info
    ssid:
      id: wifi_ssid
      internal: true
      on_value:
        - lvgl.label.update:
            id: lbl_wifi_ssid
            text: !lambda 'return x.empty() ? std::string("Connecting...") : x;'

sensor:
  # Both sensors report milliseconds (NaN = unknown, e.g. nothing playing).
  # Sendspin sends a full metadata state on every play/pause/seek/track change,
  # and the progress sensor republishes immediately on each one, then polls once
  # per second (interpolating) while playing. Every update redraws the whole
  # progress UI from BOTH sensors via one script, so a seek (or a duration that
  # arrives after the progress value) can never leave the bar/labels stale.
  - platform: sendspin
    type: track_progress
    id: track_progress
    update_interval: 1s
    on_value:
      - script.execute: update_progress_ui
  - platform: sendspin
    type: track_duration
    id: track_duration
    on_value:
      - script.execute: update_progress_ui
  # Wi-Fi signal for the top status line: green >= -60 dBm, amber >= -72, red below.
  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 5s
    on_value:
      - lvgl.label.update:
          id: lbl_wifi_rssi
          text:
            format: "%d dBm"
            args: ['(int) x']
      - if:
          condition:
            lambda: 'return x >= -60;'
          then:
            - lvgl.widget.update: {id: lbl_wifi_icon, text_color: 0x2ECC71}
            - lvgl.widget.update: {id: lbl_wifi_rssi, text_color: 0x2ECC71}
          else:
            - if:
                condition:
                  lambda: 'return x >= -72;'
                then:
                  - lvgl.widget.update: {id: lbl_wifi_icon, text_color: 0xF1C40F}
                  - lvgl.widget.update: {id: lbl_wifi_rssi, text_color: 0xF1C40F}
                else:
                  - lvgl.widget.update: {id: lbl_wifi_icon, text_color: 0xE74C3C}
                  - lvgl.widget.update: {id: lbl_wifi_rssi, text_color: 0xE74C3C}

# ---------- Physical buttons -> local speaker volume ----------
# BOOT button: GPIO0, active low -> volume up.
# PWR button: SYS_OUT line routed to TCA9554 EXIO4, active high while pressed
# -> volume down (a ~6 s hold still powers the board off via the AXP2101).
binary_sensor:
  # 3ms is approximately 144 sample frames at 48kHz. This follows
  # actual speaker startup, not the earlier Sendspin transport play event.
  - platform: template
    id: audio_output_ready
    internal: true
    lambda: |-
      return id(spk).is_running();
    filters:
      - delayed_on: 3ms
    on_press:
      - switch.turn_on: speaker_amp
    on_release:
      - switch.turn_off: speaker_amp

  - platform: gpio
    id: btn_boot_vol_up
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_up: media_player_speaker_1
  - platform: gpio
    id: btn_pwr_vol_down
    internal: true
    pin:
      pca9554: expander
      number: 4
      mode: INPUT
      inverted: false
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_down: media_player_speaker_1

script:
  # Redraw the progress bar and both time labels from the current progress and
  # duration sensor values. Unknown/invalid values show an empty bar and 0:00.
  - id: update_progress_ui
    mode: restart
    then:
      - lvgl.bar.update:
          id: progress_bar
          value: !lambda |-
            float p = id(track_progress).state;
            float d = id(track_duration).state;
            if (std::isnan(p) || std::isnan(d) || d <= 0) return 0;
            float r = p / d * 1000.0f;
            if (r < 0.0f) r = 0.0f;
            return (int) (r > 1000.0f ? 1000.0f : r);
      - lvgl.label.update:
          id: lbl_elapsed
          text:
            format: "%d:%02d"
            args:
              - '(std::isnan(id(track_progress).state) ? 0 : (int) (id(track_progress).state / 60000.0f))'
              - '(std::isnan(id(track_progress).state) ? 0 : ((int) (id(track_progress).state / 1000.0f)) % 60)'
      - lvgl.label.update:
          id: lbl_duration
          text:
            format: "%d:%02d"
            args:
              - '(std::isnan(id(track_duration).state) ? 0 : (int) (id(track_duration).state / 60000.0f))'
              - '(std::isnan(id(track_duration).state) ? 0 : ((int) (id(track_duration).state / 1000.0f)) % 60)'

  # Reflect the current speaker volume on the slider and label.
  - id: sync_volume_ui
    then:
      # Do not pull the thumb away from the user during a touch gesture.
      - if:
          condition:
            lambda: 'return id(vol_slider) != nullptr && !lv_obj_has_state(id(vol_slider), LV_STATE_PRESSED);'
          then:
            - lvgl.slider.update:
                id: vol_slider
                value: !lambda 'return (int) (id(media_player_speaker_1).volume * 100 + 0.5f);'
            - lvgl.label.update:
                id: lbl_volume
                text:
                  format: "Volume: %d%%"
                  args: ['(int) (id(media_player_speaker_1).volume * 100 + 0.5f)']

# ---------- Album art ----------
# The Sendspin server scales the artwork to `resize` before sending it, so keep
# it square. Each slot permanently reserves two RGB565 buffers in PSRAM
# (448x448x2 bytes ~= 400 kB each).
image:
  - platform: sendspin
    id: album_slot
    source: album
    format: JPEG
    type: RGB565
    resize: 448x448
    current_image:
      id: album_art
    on_image_display:
      # LVGL does not track the underlying buffer, so re-point the widget
      # every time new artwork arrives.
      - lvgl.image.update:
          id: art_bg
          src: album_art
      - lvgl.widget.show: art_bg
    # Track has no artwork (or the stream ended): LVGL would otherwise keep
    # drawing the previous album, so hide the widget.
    on_image_clear:
      - lvgl.widget.hide: art_bg
    on_image_error:
      - logger.log: "Failed to decode album art"

# ---------- UI (true-black AMOLED theme) ----------
lvgl:
  bg_color: 0x000000
  text_color: 0xFFFFFF
  pages:
    - id: main_page
      scrollable: false
      widgets:
        # Album art background. Declared first so it renders beneath
        # everything else; dimmed so the text and controls stay readable.
        - obj:
            id: art_frame
            align: CENTER
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            radius: 0
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: art_bg
                  src: album_art
                  align: CENTER
                  opa: 40%
        # Wi-Fi status line, centred so it stays clear of the rounded top corners:
        # connection dot, signal icon, network name, signal level.
        - obj:
            id: wifi_bar
            align: TOP_MID
            y: 2
            width: 300
            height: 18
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - obj:
                  id: dot_wifi
                  width: 10
                  height: 10
                  radius: 5
                  border_width: 0
                  bg_color: 0xE74C3C
              - label:
                  id: lbl_wifi_icon
                  text: "\uF1EB"   # wifi symbol
                  pad_left: 6
                  text_font: montserrat_14
                  text_color: 0x888888
              - label:
                  id: lbl_wifi_ssid
                  text: "Connecting..."
                  pad_left: 6
                  max_width: 150
                  long_mode: DOT
                  text_font: montserrat_14
                  text_color: 0xBBBBBB
              - label:
                  id: lbl_wifi_rssi
                  text: "-- dBm"
                  pad_left: 6
                  text_font: montserrat_14
                  text_color: 0x888888
        # Track title: large, bold white, centred, scrolls if too long.
        - label:
            id: lbl_title
            text: "-"
            align: TOP_MID
            y: 28
            width: 330
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER
            text_font: montserrat_28
            text_color: 0xFFFFFF
        # Artist: slightly smaller, bright accent colour for contrast on black.
        - label:
            id: lbl_artist
            text: "-"
            align: TOP_MID
            y: 74
            width: 330
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER
            text_font: montserrat_20
            text_color: 0x4FC3F7
        # Previous track button, left of play/pause.
        - button:
            id: btn_prev
            align: CENTER
            x: -105
            y: 20
            width: 84
            height: 84
            radius: 42
            scrollable: false
            bg_color: 0x333333
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\uF048"   # previous symbol
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            # Act on touch-down: a small finger movement must not cancel a skip.
            on_press:
              - logger.log: "Transport: previous track pressed"
              - media_player.previous: media_player_sendspin_1
        # Next track button, right of play/pause.
        - button:
            id: btn_next
            align: CENTER
            x: 105
            y: 20
            width: 84
            height: 84
            radius: 42
            scrollable: false
            bg_color: 0x333333
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\uF051"   # next symbol
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - logger.log: "Transport: next track pressed"
              - media_player.next: media_player_sendspin_1
        # Round play/pause button (square size + full radius = circle).
        - button:
            id: btn_play_pause
            align: CENTER
            y: 20
            width: 84
            height: 84
            radius: 42
            bg_color: 0x1E88E5
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  id: lbl_play_pause
                  align: CENTER
                  text: "\uF04B"   # play symbol
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_click:
              - media_player.toggle: media_player_sendspin_1
        # Track progress bar: sits between the transport buttons (bottom edge
        # ~y=286) and the volume controls (top edge ~y=357). Display-only,
        # range 0-1000 (permille of the track elapsed).
        - bar:
            id: progress_bar
            align: CENTER
            y: 92
            width: 260
            height: 8
            min_value: 0
            max_value: 1000
            value: 0
            bg_color: 0x333333
            radius: 4
            border_width: 0
            shadow_width: 0
            indicator:
              bg_color: 0x4FC3F7
              radius: 4
        # Elapsed time under the left end of the bar.
        - label:
            id: lbl_elapsed
            text: "0:00"
            align: CENTER
            x: -110
            y: 116
            text_font: montserrat_14
            text_color: 0xBBBBBB
        # Total track length under the right end of the bar.
        - label:
            id: lbl_duration
            text: "0:00"
            align: CENTER
            x: 110
            y: 116
            text_font: montserrat_14
            text_color: 0xBBBBBB
        # Local speaker volume (this device only, not the Sendspin group).
        # Also controlled by the BOOT (up) and PWR (down) physical buttons.
        - label:
            id: lbl_volume
            text: "Volume"
            align: BOTTOM_MID
            y: -75
        - slider:
            id: vol_slider
            align: BOTTOM_MID
            y: -40
            width: 260
            height: 16
            ext_click_area: 20
            min_value: 0
            max_value: 100
            value: 50
            # Drag only updates the label; the volume is applied once on
            # release, because speaker_source persists volume to flash
            # and a drag would otherwise write on every step.
            on_value:
              - lvgl.label.update:
                  id: lbl_volume
                  text:
                    format: "Volume: %d%%"
                    args: ['(int) x']
            on_release:
              - media_player.volume_set:
                  id: media_player_speaker_1
                  volume: !lambda 'return lv_slider_get_value(id(vol_slider)) / 100.0f;'
              - script.execute: sync_volume_ui

